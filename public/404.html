<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GESEM Planner · Pàgina no trobada</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/styles.css"/>
<script src="/js/i18n.js" defer></script>
<style>
.err-wrap{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--bg);
}
.err-box{
  text-align:center;max-width:520px;width:100%;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:48px 32px;
  box-shadow:var(--shadow-md);
}
.err-code{
  font-size:80px;font-weight:700;
  background:linear-gradient(135deg, #059669 0%, #34D399 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-0.04em;line-height:1;margin-bottom:8px;
}
.err-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:10px}
.err-desc{font-size:14px;color:var(--text-muted);line-height:1.55;margin-bottom:28px}
.err-path{
  display:inline-block;
  background:var(--bg-muted);
  padding:3px 9px;border-radius:6px;
  font-family:'Geist Mono',ui-monospace,monospace;
  font-size:12.5px;color:var(--accent-red);
  margin:0 3px;
}
.err-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.err-links{
  margin-top:36px;padding-top:24px;
  border-top:1px solid var(--border);
}
.err-links-title{
  font-size:10.5px;font-weight:600;
  color:var(--text-subtle);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:12px;
}
.err-links-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.err-links-list a{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;
  border-radius:8px;
  color:var(--text);text-decoration:none;
  font-size:13px;font-weight:500;
  transition:all 150ms;
}
.err-links-list a:hover{background:var(--bg-muted);color:var(--primary)}
.err-links-list svg{width:14px;height:14px;color:var(--text-muted);flex-shrink:0}
.err-links-list a:hover svg{color:var(--primary)}
</style>
</head>
<body>
<div class="err-wrap">
  <div class="err-box">
    <div class="err-code">404</div>
    <div class="err-title">Pàgina no trobada</div>
    <div class="err-desc">
      No hem trobat <span class="err-path" id="err-path">/...</span>
      <br>Potser hi ha un error a l'URL o la pàgina ha canviat de lloc.
    </div>

    <div class="err-actions">
      <a href="/peticio" class="btn btn-p">Tornar a Petició</a>
      <button class="btn" onclick="history.back()">← Pàgina anterior</button>
    </div>

    <div class="err-links">
      <div class="err-links-title">O ves directament a:</div>
      <div class="err-links-list">
        <a href="/peticio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>
          Nova petició
        </a>
        <a href="/gestio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
          Reserves
        </a>
        <a href="/canvis">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          Canvis
        </a>
        <a href="/formadors">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          Formadors
        </a>
        <a href="/entrades">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          Entrades
        </a>
        <a href="/changelog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Changelog
        </a>
      </div>
    </div>
  </div>
</div>
<script>
  document.getElementById('err-path').textContent = window.location.pathname;
  // Aplica mode fosc si està guardat
  try{
    const saved=localStorage.getItem('theme');
    const prefDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
    if(saved==='dark'||(!saved&&prefDark))document.body.classList.add('dark');
  }catch(e){}
</script>
</body>
</html>
